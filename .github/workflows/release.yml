name: Release

# Every push to main publishes a new version automatically (patch bump,
# e.g. 1.0.1 -> 1.0.2). Pushes that only change docs are skipped.
#
# Other ways to publish:
#  - Actions tab -> "Release" -> "Run workflow" to pick patch / minor / major.
#  - Push a tag yourself, e.g. `npm version minor && git push --follow-tags`.
#
# The Windows installer and latest.yml are attached to a GitHub Release.
# Installed copies of VLT find it when you click "Check for updates".

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  bump:
    # Manual releases and pushes to main get a new version number (not tag pushes).
    needs: [test]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TAG=$(npm version ${{ inputs.bump || 'patch' }} -m "Release %s")
          git push origin HEAD:main --follow-tags
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: [test, bump]
    if: always() && needs.test.result == 'success' && (needs.bump.result == 'success' || (startsWith(github.ref, 'refs/tags/v') && needs.bump.result == 'skipped'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check tag matches package.json version
        shell: bash
        run: |
          TAG="${{ needs.bump.outputs.tag || github.ref_name }}"
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $VERSION"
            exit 1
          fi
      - run: npm ci
      - name: Build installer
        run: npx electron-builder --win --x64 --publish never
      # Publish in one step. (Letting electron-builder upload files in parallel
      # can create duplicate releases for the same tag, which breaks downloads.)
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.bump.outputs.tag || github.ref_name }}
        run: |
          for f in dist/VLT-Setup.exe dist/VLT-Setup.exe.blockmap dist/latest.yml; do
            test -f "$f" || { echo "::error::Missing build output $f"; exit 1; }
          done
          # Re-runs replace any earlier (possibly partial) release for this tag.
          while gh release view "$TAG" >/dev/null 2>&1; do gh release delete "$TAG" --yes; done
          gh release create "$TAG" dist/VLT-Setup.exe dist/VLT-Setup.exe.blockmap dist/latest.yml \
            --title "VLT ${TAG#v}" --notes "Download **VLT-Setup.exe** below to install, or click *Check for updates* in VLT." --latest
